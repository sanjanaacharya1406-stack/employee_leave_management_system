{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-card">
<h1>Welcome back</h1><p class="muted">Log in to manage your leave requests.</p>
<form method="post">
<label>Email</label><input type="email" name="email" required>
<label>Password</label><input type="password" name="password" required>
<button type="submit">Login</button>
<p>
    <a href="{{ url_for('forgot_password') }}">
        Forgot Password?
    </a>
</p>
</form>
<p>New user? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
