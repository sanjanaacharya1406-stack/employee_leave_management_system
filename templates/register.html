{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<section class="auth-card">
<h1>Create account</h1>
<form method="post">
<label>Full name</label><input name="name" required>
<label>Email</label><input type="email" name="email" required>
<label>Password (minimum 6 characters)</label><input type="password" name="password" minlength="6" required>
<label>Account type</label><select name="role"><option value="employee">Employee</option><option value="manager">Manager (demo)</option></select>
<button type="submit">Register</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
