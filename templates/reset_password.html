{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2>Reset Your Password</h2>

    <form method="POST">

        <label>Enter New Password</label>

        <input type="password"
               name="password"
               placeholder="New Password"
               minlength="6"
               required>

        <button type="submit">Change Password</button>

    </form>

</div>

{% endblock %}
